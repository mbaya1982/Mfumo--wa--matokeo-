<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KATULO MFUMO WA MATOKEO</title>
  <meta name="description" content="Katulo Mfumo wa Matokeo - mfumo wa kuangalia matokeo ya wanafunzi mtandaoni.">
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;font-family:Arial,Helvetica,sans-serif;
      background:linear-gradient(135deg,#eef7ff,#ffffff);
      color:#123;
    }
    .top{
      background:#075985;color:white;text-align:center;padding:28px 15px;
    }
    .top h1{margin:0;font-size:28px}
    .top p{margin:8px 0 0;font-size:16px}
    .card{
      max-width:620px;margin:35px auto;padding:28px 22px;
      background:white;border-radius:18px;
      box-shadow:0 8px 30px rgba(0,0,0,.10);
      text-align:center;
    }
    .logo{
      width:90px;height:90px;margin:0 auto 15px;border-radius:50%;
      background:#075985;color:white;display:flex;align-items:center;
      justify-content:center;font-weight:bold;font-size:22px;
    }
    h2{margin:8px 0 10px;color:#075985}
    .info{line-height:1.7;color:#555}
    .btn{
      display:inline-block;margin-top:18px;padding:13px 25px;
      background:#075985;color:white;text-decoration:none;
      border-radius:10px;font-weight:bold;
    }
    .btn:hover{background:#0c4a6e}
    footer{text-align:center;padding:20px;color:#666;font-size:13px}
  </style>
</head>
<body>

  <header class="top">
    <h1>KATULO MFUMO WA MATOKEO</h1>
    <p>Matokeo ya shule kwa njia ya mtandao</p>
  </header>

  <main class="card">
    <div class="logo">KATULO</div>
    <h2>Karibu kwenye Mfumo wa Matokeo</h2>
    <p class="info">
      Mfumo huu umeandaliwa kwa ajili ya kuwezesha shule kuwasilisha
      na wanafunzi/wazazi kuangalia matokeo kwa urahisi kupitia mtandao.
    </p>

    <a class="btn" href="#" onclick="alert('Ukurasa wa matokeo utaunganishwa hapa.'); return false;">
      ANGALIA MATOKEO
    </a>
  </main>

  <footer>
    © 2026 KATULO MFUMO WA MATOKEO
  </footer>

</body>
</html>
