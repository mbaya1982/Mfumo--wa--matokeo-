<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KATULO - Mfumo wa Matokeo</title><style>body{font-family:Arial;margin:0;background:#f3f6f9;color:#222}header{background:#075b3a;color:#fff;text-align:center;padding:24px}main{max-width:1000px;margin:25px auto;padding:0 15px}.card{background:#fff;padding:20px;margin-bottom:18px;border-radius:12px;box-shadow:0 2px 10px #0001}input,select,button{padding:11px;margin:4px;border-radius:6px;border:1px solid #ccc}button{background:#075b3a;color:white;border:0}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{border:1px solid #ddd;padding:9px;text-align:center}th{background:#075b3a;color:#fff}</style></head><body><header><h1>KATULO - MFUMO WA MATOKEO</h1><p>MFUMO WA MATOKEO YA MITIHANI</p></header><main><div class="card"><h2>Tafuta Matokeo</h2><input id="q" placeholder="Jina la mwanafunzi"><select id="s"><option value="">Shule zote</option><option>Kahanga</option><option>Ifunde</option><option>Lowa</option><option>Buduba</option><option>Tumaini</option></select><button onclick="tafuta()">TAFUTA</button></div><div class="card"><table><thead><tr><th>#</th><th>Shule</th><th>Jina</th><th>Jumla</th><th>Ufaulu</th></tr></thead><tbody id="data"><tr><td>1</td><td>Lowa</td><td>Mwanafunzi wa Mfano</td><td>250</td><td>Amefaulu</td></tr></tbody></table></div></main><script>function tafuta(){let q=document.getElementById('q').value.toLowerCase(),s=document.getElementById('s').value.toLowerCase();document.querySelectorAll('#data tr').forEach(r=>{let t=r.innerText.toLowerCase();r.style.display=(!q||t.includes(q))&&(!s||t.includes(s))?'':'none'})}</script></body></html>
